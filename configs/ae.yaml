# Autoencoder training config — conv pool + unfrozen decoder, text-to-SQL task
#
# Trains the AttentionPool + ReconstructionNet on OpenWebText + synthetic SQL
# and evaluates round-trip reconstruction on held-out Spider (execution accuracy).
#
# Launch:  uv run python -m ired.train_autoencoder --config configs/ae_conv_pg.yaml
# CLI args override config values, so e.g. `--seed 42` on the command line
# wins over the `seed: 0` below.

# ── Model ──────────────────────────────────────────────────────────────
model: facebook/bart-base   # base | large (diffusion space grows with d_ae, so large is costly)

# ── AttentionPool (f_φ) ────────────────────────────────────────────────
k: 384                       # latent slots (increased for longer max_a_length)
pool_layers: 2
pool_heads: 8
pool_type: conv              # depthwise-separable conv + adaptive pool
# d_ae: 128                  # uncomment to shrink diffusion space
# diffusion space -> k*d_ae, so d_ae = 128 → 32k dim, vs 768 → 196k for full BART base
# ── ReconstructionNet (f_ψ) ────────────────────────────────────────────
recon_layers: 2
recon_heads: 8

# ── Decode-side knobs ──────────────────────────────────────────────────
unfreeze_decoder: true       # fine-tune BART decoder jointly (encoder stays frozen)
decoder_lr: 1.0e-5           # separate (smaller) LR for decoder params

# ── Task ───────────────────────────────────────────────────────────────
task: sql                    # sql (OWT + synthetic SQL, eval Spider) | code (legacy MBPP/HumanEval)

# ── Training data ──────────────────────────────────────────────────────
train_dataset: openwebtext
owt_samples: 100000          # OWT docs to materialize
owt_min_chars: 200
owt_max_chars: 4000
owt_eval_samples: 256

sql_mix_ratio: 0.5           # fraction synthetic SQL (gretelai/synthetic_text_to_sql); rest OWT
sql_samples: 50000           # synthetic-SQL queries to materialize
sql_min_chars: 20
sql_max_chars: 1000          # skip (not truncate) longer queries — truncating yields invalid SQL

mixed_length: 200000         # virtual length of mixed OWT+SQL dataset

# ── Optimization ───────────────────────────────────────────────────────
batch_size: 64
grad_accum_steps: 1          # effective batch = batch_size × this
lr: 1.0e-4
weight_decay: 0.01
warmup_steps: 500
min_lr_ratio: 0.1            # cosine floor as fraction of lr

steps: 20000                 # total optimizer steps (more steps for larger K/longer seqs)
log_every: 50                # steps between log lines
eval_every: 1000             # steps between eval cycles

# ── Eval ───────────────────────────────────────────────────────────────
max_a_length: 512            # tokenizer truncation cap for the round-tripped answer
eval_n_examples: 64          # held-out Spider examples each eval cycle
sql_exec: true               # execution accuracy vs the real Spider DBs (result-set match); else string match
sql_exec_timeout: 5.0        # per-query wall-clock timeout for the SQL execution verifier

# ── Infrastructure ─────────────────────────────────────────────────────
num_workers: 4
seed: 0
device: cuda                 # cuda | cpu
tui: true                    # Rich+plotext TUI (graphs + scrolling log)
save_dir: checkpoints/ae_sql_conv

# ── HuggingFace Hub (optional) ─────────────────────────────────────────
push_to_hub: true
hub_repo: roy-W/ired-reasoning
# hub_token: hf_...          # defaults to HF_TOKEN env var
hub_private: false
