# EBM / latent-diffusion training config — IRED energy net over AE latents
#
# Launch:  uv run python -m ired.train_diffusion --config configs/ebm.yaml
# CLI args override config values, so e.g. `--seed 42` on the command line
# wins over the `seed: 0` below.
#
# Milestone 2 (gensis.md §9): only the EBM updates; the autoencoder (frozen
# BART + previously trained pool/recon/point-generator) is held fixed. Train on
# MBPP; eval on MBPP test + HumanEval (held-out).

# ── Autoencoder (must match the AE checkpoint) ─────────────────────────────
# k / pool_type / d_ae / use_copy are AUTO-OVERRIDDEN from the checkpoint's
# saved config on load — the values below are only a fallback for older
# checkpoints. Keep them aligned with configs/ae_conv_pg.yaml to avoid surprises.
model: facebook/bart-base
ae_ckpt: hf://roy-W/ired-reasoning/checkpoints/ae_conv_norm_copy2/ae_latest.pt
k: 256                       # latent slots (must match AE)
pool_type: conv              # depthwise-separable conv + adaptive pool (must match AE)
pool_layers: 2
pool_heads: 8
use_copy: true               # AE has a PointerGenerator (point generator) head
# d_ae: 128                  # diffusion-space dim; -1/unset = full d_model
recon_layers: 2
recon_heads: 8

# ── Energy network (the only trained module) ───────────────────────────────
ebm_layers: 4
ebm_heads: 8
ebm_ff_mult: 4

# ── Diffusion / inner-loop ─────────────────────────────────────────────────
timesteps: 10
inner_steps: 5               # IRED opt_step refinements per outer DDPM step
beta_schedule: linear        # linear | cosine
opt_step_size: 1.0
x_start_clamp: 5.0            # clamp predicted x_0 to ±this (<=0 disables)
envelope_sf: -1.0            # >0 → clamp z to ±sqrt(alpha_bar_t)*sf (IRED uses 2.0)

# ── Loss terms ─────────────────────────────────────────────────────────────
# Always on: denoising MSE + NCE (E(real) < E(geometric hard-negative)).
no_nce: false                # set true to disable NCE energy-landscape supervision
nce_scale: 1.0               # λ on the NCE term

# rand-neg anchor: E(real) + margin < E(N(0,I)). Gate to low t — at high t,
# q(z_t|z_a) and N(0,I) overlap and the anchor fights eps prediction.
rand_neg_weight: 0.0         # 0 disables; recommended start: 1.0
rand_neg_margin: 1.0
rand_neg_t_max: 3            # with T=10, low-noise only

# decoder-aux: CE(decode_nocopy(x0_hat), gold) on low-t samples. Grounds the
# one-step denoising prediction in the inference (no-copy) generator.
decoder_aux_weight: 0.0      # 0 disables; recommended start: 0.1
decoder_aux_t_max: 2

# gen-neg: generator-grounded negative. Decodes the NCE-mined latent through the
# no-copy (inference) generator; where that decode is wrong (no-copy CE >
# ce_thresh), pushes E(real) + margin < E(refined). Makes the energy MINIMA
# coincide with latents the point-generator can actually decode. The decode is a
# detached gate — gradient flows only through the energy margin (cheap).
gen_neg_weight: 1.0          # 0 disables; recommended start: 1.0
gen_neg_margin: 1.0
gen_neg_t_max: 3             # clean x_0 estimate only reliable at low noise
gen_neg_ce_thresh: 0.5       # nats/token above which a mined latent is a negative

# ── Training data ──────────────────────────────────────────────────────────
train_dataset: mbpp
mbpp_config: full            # full (974) | sanitized (427)

# ── Optimization ───────────────────────────────────────────────────────────
batch_size: 32
grad_accum_steps: 1          # effective batch = batch_size × this
lr: 3.0e-4
weight_decay: 0.0
latent_stats_samples: 1024   # train answers encoded for the per-dim N(0,I) shift/scale

steps: 5000                  # total optimizer steps
log_every: 50                # steps between log lines
eval_every: 500              # steps between end-to-end eval cycles

# ── Eval ───────────────────────────────────────────────────────────────────
max_q_length: 512            # HumanEval prompts can be long
max_a_length: 384            # MBPP solutions + HumanEval functions
eval_n_examples: 80          # per-corpus examples each eval

# ── Infrastructure ─────────────────────────────────────────────────────────
num_workers: 2
seed: 0
device: cuda                 # cuda | cpu
tui: true                    # Rich+plotext TUI (graphs + scrolling log)
save_dir: checkpoints/ebm
# resume: hf://roy-W/ired-reasoning/checkpoints/ebm/ebm_latest.pt

# ── HuggingFace Hub (optional) ─────────────────────────────────────────────
# push_to_hub: roy-W/ired-reasoning   # repo id; uploads ebm_latest.pt when done
hub_private: false
