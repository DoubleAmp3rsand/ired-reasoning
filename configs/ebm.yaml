# EBM / latent-diffusion training config — IRED energy net over AE latents
#
# Launch:  uv run python -m ired.train_diffusion --config configs/ebm.yaml
# CLI args override config values, so e.g. `--seed 42` on the command line
# wins over the `seed: 0` below.
#
# Milestone 2 (gensis.md §7): only the EBM updates; the autoencoder (frozen
# BART + previously trained pool/recon) is held fixed. Train on the synthetic
# clue generator (ired/puzzle_gen.py); eval on a DIFFERENT generator — held-out
# WildEval/ZebraLogic prose (transfer) + larger synthetic puzzles (length-gen).
# The inner-gap (acc − acc_inner0) is the reasoning-vs-fitting discriminator.

# ── Autoencoder (must match the AE checkpoint) ─────────────────────────────
# k / pool_type / d_ae are AUTO-OVERRIDDEN from the checkpoint's saved config
# on load — the values below are only a fallback for older checkpoints.
model: facebook/bart-base
ae_ckpt: checkpoints/ae_zebra_conv/ae_latest.pt
k: 384                       # latent slots (must match AE)
pool_type: conv              # depthwise-separable conv + adaptive pool (must match AE)
pool_layers: 2
pool_heads: 8
# d_ae: 128                  # diffusion-space dim; -1/unset = full d_model
recon_layers: 2
recon_heads: 8

# ── Energy network (the only trained module) ───────────────────────────────
ebm_layers: 4
ebm_heads: 8
ebm_ff_mult: 4

# ── Diffusion / inner-loop ─────────────────────────────────────────────────
timesteps: 10
inner_steps: 20              # IRED opt_step refinements per outer DDPM step
beta_schedule: cosine        # cosine (linear removed)
opt_step_size: 1.0
x_start_clamp: 5.0            # clamp predicted x_0 to ±this (<=0 disables)
envelope_sf: -1.0            # >0 → clamp z to ±sqrt(alpha_bar_t)*sf (IRED uses 2.0)

# Stochastic inner loop (inference only).
opt_noise_scale: 0.0         # try ~0.1 to start
opt_reject: true             # false + noise>0 → true Langevin (accepts uphill moves)

# ── Loss terms ─────────────────────────────────────────────────────────────
# Always on: denoising MSE + NCE (E(real) < E(geometric hard-negative)).
no_nce: false                # set true to disable NCE energy-landscape supervision
nce_scale: 1.0               # λ on the NCE term

# rand-neg anchor: E(real) + margin < E(N(0,I)).
rand_neg_weight: 0.0         # 0 disables; recommended start: 1.0
rand_neg_margin: 1.0
rand_neg_t_max: 3            # with T=10, low-noise only

# decoder-aux: CE(decode_nocopy(x0_hat), gold) on low-t samples.
decoder_aux_weight: 0.0      # 0 disables; recommended start: 0.1
decoder_aux_t_max: 2

# gen-neg: generator-grounded negative.
gen_neg_weight: 1.0          # 0 disables; recommended start: 1.0
gen_neg_margin: 1.0
gen_neg_t_max: 3             # clean x_0 estimate only reliable at low noise
gen_neg_ce_thresh: 0.5       # nats/token above which a mined latent is a negative

# ── Training data — synthetic clue generator (different from the eval) ───────
clue_samples: 20000          # synthetic clue puzzles to materialize for training
clue_min_size: 2             # train puzzle size band (houses)...
clue_max_size: 4             # ...eval-2 tests generalization ABOVE this
clue_min_attrs: 3
clue_max_attrs: 5
clue_min_level: 5            # generator difficulty (WildEval-aligned relations)
clue_max_level: 8
clue_minimize_seconds: 2.0   # per-puzzle clue-minimization cap

# ── Eval-1 (primary): held-out WildEval prose — generator→WildEval transfer ──
zebra_min_size: 2            # smallest WildEval puzzle (houses) to eval on
zebra_max_size: 6            # largest WildEval puzzle (houses) to eval on

# ── Eval-2: generator puzzles above the training band — length generalization ─
gen_eval_min_size: 5
gen_eval_max_size: 6

# ── Optimization ───────────────────────────────────────────────────────────
batch_size: 32
grad_accum_steps: 1          # effective batch = batch_size × this
lr: 3.0e-4
weight_decay: 0.0
latent_stats_samples: 1024   # train answers encoded for the per-dim N(0,I) shift/scale

steps: 5000                  # total optimizer steps
log_every: 50                # steps between log lines
eval_every: 500              # steps between end-to-end eval cycles

# ── Eval ───────────────────────────────────────────────────────────────────
max_q_length: 512            # ZebraLogic puzzle clues can be long
max_a_length: 384            # serialized grid solutions
eval_n_examples: 80          # per-corpus examples each eval

# ── Infrastructure ─────────────────────────────────────────────────────────
num_workers: 2
seed: 0
device: cuda                 # cuda | cpu
tui: true                    # Rich+plotext TUI (graphs + scrolling log)
save_dir: checkpoints/ebm

# ── HuggingFace Hub (optional) ─────────────────────────────────────────────
hub_private: false
