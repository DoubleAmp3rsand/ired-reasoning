# Autoencoder training config — conv pool + unfrozen decoder, ZebraLogic task
#
# Trains the AttentionPool + ReconstructionNet on OpenWebText and evaluates
# round-trip reconstruction on held-out ZebraLogic puzzles by puzzle-level
# exact match.
#
# Why ZebraLogic: the AE round-trip is the binding ceiling for any
# execution-graded structured target. ZebraLogic keeps an irreducibly
# natural-language problem (so the language AE is load-bearing) AND an exactly
# verifiable answer, while the answer surface is low-entropy / common-noun /
# fixed-format — the regime the frozen-anchor AE reconstructs well.
# "Sudoku stated in English."
#
# Launch:  uv run python -m ired.train_autoencoder --config configs/ae_zebra.yaml
# CLI args override config values (e.g. `--seed 42` wins over `seed: 0`).

# ── Model ──────────────────────────────────────────────────────────────
model: facebook/bart-base   # base | large (diffusion space grows with d_ae)

# ── AttentionPool (f_φ) ────────────────────────────────────────────────
k: 384                       # latent slots
pool_layers: 2
pool_heads: 8
pool_type: conv              # depthwise-separable conv + adaptive pool
# d_ae: 128                  # uncomment to shrink diffusion space (k*d_ae)

# ── ReconstructionNet (f_ψ) ────────────────────────────────────────────
recon_layers: 2
recon_heads: 8

# ── Decode-side knobs ──────────────────────────────────────────────────
unfreeze_decoder: true       # fine-tune BART decoder jointly (encoder stays frozen)
decoder_lr: 1.0e-5           # separate (smaller) LR for decoder params

# ── Training data ──────────────────────────────────────────────────────
train_dataset: openwebtext
owt_samples: 100000          # OWT docs to materialize
owt_min_chars: 200
owt_max_chars: 4000
owt_eval_samples: 256

# ── Optimization ───────────────────────────────────────────────────────
batch_size: 64
grad_accum_steps: 1          # effective batch = batch_size × this
lr: 1.0e-4
weight_decay: 0.01
warmup_steps: 500
min_lr_ratio: 0.1            # cosine floor as fraction of lr

steps: 20000                 # total optimizer steps
log_every: 50                # steps between log lines
eval_every: 1000             # steps between eval cycles

# ── Eval ───────────────────────────────────────────────────────────────
max_a_length: 512            # tokenizer truncation cap for the round-tripped grid
eval_n_examples: 64          # held-out ZebraLogic puzzles each eval cycle
zebra_min_size: 2            # smallest puzzle (houses) to keep in eval
zebra_max_size: 6            # largest puzzle (houses) to keep in eval

# ── Infrastructure ─────────────────────────────────────────────────────
num_workers: 4
seed: 0
device: cuda                 # cuda | cpu
tui: true                    # Rich+plotext TUI (graphs + scrolling log)
save_dir: checkpoints/ae_zebra_conv

# ── HuggingFace Hub (optional) ─────────────────────────────────────────
push_to_hub: true
hub_repo: roy-W/ired-reasoning
# hub_token: hf_...          # defaults to HF_TOKEN env var
hub_private: false
