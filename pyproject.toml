[project]
name = "ired-reasoning"
version = "0.1.0"
description = "Latent-diffusion IRED for LLM reasoning — Stable-Diffusion-style thinking module"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.5.0",
    "transformers>=4.45.0",
    "datasets>=2.20.0",
    "tqdm>=4.66.0",
    "sentencepiece>=0.2.0",
    "protobuf>=4.25.0",
    "accelerate>=0.34.0",
    "rich>=15.0.0",
    "plotext>=5.3.2",
    "torchmetrics>=1.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ired"]
